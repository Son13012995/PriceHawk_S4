# SearXNG Settings
# Minimal overrides for internal Docker usage

use_default_settings: true

server:
  secret_key: "pricehawk-secret-key-2026"

search:
  default_lang: "vi"
  formats:
    - html
    - json

ui:
  default_locale: "vi"

limiter:
  enabled: false

botdetection:
  enabled: false

engines:
  - name: google
    disabled: true
  - name: bing
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: brave
    disabled: false
  - name: startpage
    disabled: false
