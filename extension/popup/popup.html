<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PriceHawk Scanner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="popup.css"/>
</head>
<body>
  <div id="app">

    <!-- Header -->
    <header>
      <div class="logo">
        <div class="logo-icon">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
            <path d="M10 2L18 6V14L10 18L2 14V6L10 2Z" stroke="#fff" stroke-width="1.5" fill="none"/>
            <path d="M10 6L14 8V12L10 14L6 12V8L10 6Z" fill="#fff" opacity="0.5"/>
            <circle cx="10" cy="10" r="2" fill="#fff"/>
          </svg>
        </div>
        <div class="logo-text">
          <div class="logo-name">PriceHawk</div>
          <div class="logo-sub">Price Scanner</div>
        </div>
      </div>
      <div id="status-badge" class="status-badge idle">
        <div class="dot"></div>
        <span id="status-text">Ready</span>
      </div>
    </header>

    <!-- Scan Section -->
    <section id="scan-section" class="section">
      <div class="section-title">Scan Product</div>

      <!-- Name field -->
      <div class="field-card" id="name-row">
        <div class="field-body">
          <div class="field-label">Product Name</div>
          <div id="name-display" class="field-value empty">Not selected</div>
        </div>
        <button id="btn-pick-name" class="pick-btn">
          <svg width="11" height="11" viewBox="0 0 14 14"><path d="M2 2l10 4-5 1-1 5-4-10z" fill="currentColor"/></svg>
          Pick
        </button>
      </div>

      <!-- Price field -->
      <div class="field-card" id="price-row">
        <div class="field-body">
          <div class="field-label">Current Price</div>
          <div id="price-display" class="field-value empty">Not selected</div>
        </div>
        <button id="btn-pick-price" class="pick-btn">
          <svg width="11" height="11" viewBox="0 0 14 14"><path d="M2 2l10 4-5 1-1 5-4-10z" fill="currentColor"/></svg>
          Pick
        </button>
      </div>

      <!-- Currency + Category row -->
      <div class="meta-row">
        <!-- Currency selector -->
        <div class="meta-card" id="currency-card">
          <div class="cat-label">Currency</div>
          <div class="currency-select-wrap">
            <select id="currency-select" class="category-select">
              <option value="VND">₫ VND</option>
              <option value="USD">$ USD</option>
              <option value="EUR">€ EUR</option>
              <option value="JPY">¥ JPY</option>
              <option value="KRW">₩ KRW</option>
              <option value="CNY">¥ CNY</option>
              <option value="GBP">£ GBP</option>
              <option value="SGD">S$ SGD</option>
              <option value="THB">฿ THB</option>
              <option value="MYR">RM MYR</option>
            </select>
            <span id="rate-badge" class="rate-badge hidden"></span>
          </div>
        </div>

        <!-- Category selector -->
        <div class="meta-card">
          <div class="cat-label">Category</div>
          <select id="category-select" class="category-select">
            <option value="dien-thoai">Phone</option>
            <option value="tablet">Tablet</option>
            <option value="laptop">Laptop</option>
          </select>
        </div>
      </div>

      <!-- Picker hint -->
      <div id="picker-hint" class="hint-bar hidden">
        <span id="hint-text">Click an element on the page</span>
        <button id="btn-cancel-pick" class="cancel-btn">✕ Cancel</button>
      </div>

      <!-- Compare CTA -->
      <button id="btn-compare" class="compare-btn" disabled>
        <svg width="15" height="15" viewBox="0 0 20 20" fill="none">
          <path d="M4 10h12M10 4l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span id="compare-label">Compare Price</span>
        <span id="compare-spinner" class="spinner hidden"></span>
      </button>
    </section>

    <!-- Result Section -->
    <section id="result-section" class="hidden">

      <!-- Verdict -->
      <div id="verdict-banner" class="verdict-banner">
        <div id="verdict-icon" class="verdict-icon"></div>
        <div class="verdict-text">
          <div id="verdict-title" class="verdict-title"></div>
          <div id="verdict-sub" class="verdict-sub"></div>
        </div>
      </div>

      <!-- Price stats -->
      <div id="stats-grid" class="stats-grid"></div>

      <!-- Details -->
      <div id="detail-section" class="detail-section"></div>

      <!-- Comparison list -->
      <div id="comparison-section" class="comparison-section hidden">
        <div class="comparison-header">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none">
            <path d="M2 4h12M2 8h8M2 12h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span>Price Comparisons</span>
        </div>
        <div id="comparison-list" class="comparison-list"></div>
      </div>

      <!-- Reset -->
      <div class="result-actions">
        <button id="btn-reset" class="reset-btn">← Scan another product</button>
      </div>

    </section>

  </div>
  <script src="popup.js"></script>
</body>
</html>
