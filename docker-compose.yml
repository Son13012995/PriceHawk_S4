services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: pricecomparison
      MYSQL_PASSWORD: rootpassword
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mynetwork

  main:
    container_name: pricecomparison
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env.product
    depends_on:
      - mysql
    networks:
      - mynetwork

  crawler:
    container_name: price_hawk_crawler
    build:
      context: .
      dockerfile: price-hawk/docker/Dockerfile.cron
    volumes:
      - ./price-hawk:/app/price-hawk
      - ./price-hawk/logs:/app/price-hawk/logs
    env_file:
      - ./price-hawk/.env.product
    environment:
      - TZ=Asia/Ho_Chi_Minh
    depends_on:
      - mysql
    restart: unless-stopped
    networks:
      - mynetwork

  chatbot:
    container_name: pricehawk_chatbot
    build:
      context: ./chatbot
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./chatbot/.env.product
    depends_on:
      mysql:
        condition: service_healthy
      searxng:
        condition: service_started
    restart: unless-stopped
    networks:
      - mynetwork

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "8083:8080"          # host:8083 → container:8080 (SearxNG default, không đổi được)
    environment:
      - SEARXNG_SECRET_KEY=pricehawk-secret-key-2026
      - SEARXNG_BIND_ADDRESS=0.0.0.0:8080
      - SEARXNG_SETTINGS_PATH=/etc/searxng/settings.yml
      - SEARXNG_UWSGI_WORKERS=4
    volumes:
      - ./searxng_settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped
    networks:
      - mynetwork

volumes:
  mysql_data:

networks:
  mynetwork: