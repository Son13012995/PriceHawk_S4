services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: pricecomparison
      MYSQL_PASSWORD: rootpassword
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: >
      --max_connections=30
      --innodb_buffer_pool_size=128M
      --tmp_table_size=16M
      --max_heap_table_size=16M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 300M
        reservations:
          memory: 200M
    networks:
      - mynetwork

  main:
    container_name: pricecomparison
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env.product
    depends_on:
      mysql:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 200M
        reservations:
          memory: 100M
    networks:
      - mynetwork

  crawler:
    container_name: price_hawk_crawler
    build:
      context: .
      dockerfile: price-hawk/docker/Dockerfile.cron
    volumes:
      - ./price-hawk:/app/price-hawk
      - ./price-hawk/logs:/app/price-hawk/logs
    env_file:
      - ./price-hawk/.env.product
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - MEILI_URL=http://meilisearch:7700
      - MEILI_MASTER_KEY=pricehawk-meili-master-key-2026
    depends_on:
      - mysql
      - meilisearch
    restart: unless-stopped
    networks:
      - mynetwork

  chatbot:
    container_name: pricehawk_chatbot
    build:
      context: ./chatbot
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./chatbot/.env.product
    depends_on:
      mysql:
        condition: service_healthy
      searxng:
        condition: service_started
      meilisearch:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          memory: 128M
    networks:
      mynetwork:        # ← object, không phải array
        aliases:
          - chatbot


  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "8083:8080"
    environment:
      - SEARXNG_SECRET_KEY=pricehawk-secret-key-2026
      - SEARXNG_BIND_ADDRESS=0.0.0.0:8080
      - SEARXNG_SETTINGS_PATH=/etc/searxng/settings.yml
      - SEARXNG_UWSGI_WORKERS=2
    volumes:
      - ./searxng_settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: 150M
        reservations:
          memory: 64M
    networks:
      - mynetwork

  meilisearch:
    image: getmeili/meilisearch:v1.13
    container_name: meilisearch
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=pricehawk-meili-master-key-2026
      - MEILI_ENV=development
    volumes:
      - meili_data:/meili_data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 256M
        reservations:
          memory: 64M
    networks:
      - mynetwork

volumes:
  mysql_data:
  meili_data:

networks:
  mynetwork: